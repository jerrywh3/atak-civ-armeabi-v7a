# Restores an asset the public ATAK-CIV source drop is missing.
#
# AppVersionUpgrade.onUpgrade() opens assets/wms/cleanup.properties on every
# first run. FileSystemUtils.getInputStreamFromAsset() returns null when the
# asset is absent instead of throwing, and the caller only catches IOException,
# so Properties.load(null) throws an uncaught NullPointerException and ATAK
# dies right after the first-run wizard.
#
# The file maps a legacy WMS pointer filename to the sha256 of the last copy
# ATAK shipped, so an untouched one can be deleted on upgrade. On a fresh
# install there is nothing to clean, so an empty table is the correct content.
